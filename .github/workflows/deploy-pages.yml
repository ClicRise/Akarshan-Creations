name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static site
        run: bun run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Package site and product photos
        run: bun run scripts/prepare-hostinger.mjs
        env:
          OUTPUT_DIR: github-pages
          ASSET_ORIGIN: https://id-preview--cdfd2005-02aa-475f-9e25-8370c15a52d4.lovable.app
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
